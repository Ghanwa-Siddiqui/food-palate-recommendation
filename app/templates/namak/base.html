<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}namak{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ asset_url('namak.css') }}">
  <link rel="stylesheet" href="{{ asset_url('ui.css') }}">
  {# Cookie mirrors the sessionStorage flag: where site data is blocked the
     flag never persisted, so the splash replayed on every navigation and ate
     the first click each time. Either marker is enough to skip it. #}
  <script>(function(){var s=false;try{s=sessionStorage.getItem('namakSplashSeen')==='1';}catch(e){}if(!s){s=/(?:^|;\s*)namakSplashSeen=1(?:;|$)/.test(document.cookie);}if(s){document.documentElement.classList.add('no-splash');}})();</script>
  {% block head %}{% endblock %}
</head>
<body>
<div class="namak-splash" id="namak-splash" aria-hidden="true">
  <div class="splash-glow"></div>
  <div class="splash-ring"></div>
  <div class="splash-chilli c-long"></div>
  <div class="splash-chilli c-stem-a"></div>
  <div class="splash-chilli c-stem-b"></div>
  <div class="splash-chilli c-half"></div>
  <div class="splash-chilli c-wedge"></div>
  <div class="splash-chilli c-slice-a"></div>
  <div class="splash-chilli c-slice-b"></div>
  <div class="splash-chilli c-slice-c"></div>
  <div class="splash-chilli c-slice-d"></div>
  <div class="splash-chilli c-sliver"></div>
  <div class="splash-word">
    <span class="sl" style="--i:0">n</span><span class="sl em" style="--i:1">a</span><span class="sl" style="--i:2">m</span><span class="sl" style="--i:3">a</span><span class="sl" style="--i:4">k</span>
  </div>
  <div class="splash-rule"></div>
</div>
<script>
(function(){
  var el = document.getElementById('namak-splash');
  if(!el || document.documentElement.classList.contains('no-splash')) return;
  var finished = false;
  function done(){
    if(finished) return;
    finished = true;
    try{ sessionStorage.setItem('namakSplashSeen','1'); }catch(e){}
    // Session cookie fallback for when storage is unavailable, so the splash
    // does not replay on every page of the visit.
    try{ document.cookie = 'namakSplashSeen=1; path=/; SameSite=Lax'; }catch(e){}
    el.style.display='none';
    window.removeEventListener('pointerdown', done, true);
    window.removeEventListener('keydown', done, true);
  }
  // Listen at the window, not on the overlay: the overlay is pointer-events:none
  // so the click still reaches whatever button is underneath it.
  window.addEventListener('pointerdown', done, true);
  window.addEventListener('keydown', done, true);
  el.addEventListener('animationend', function(ev){ if(ev.animationName==='namakSplashOut') done(); });
  window.setTimeout(done, 3000);
})();
</script>
{% block body %}{% endblock %}
</body>
</html>
